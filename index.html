<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entropy">
<meta name="theme-color" content="#07080f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Entropy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen arcade cabinet — HUD rail on top, playfield, ability rail below; overlays slide in from the side away from the tapped tile */
:root {
  --bg: #07080f; --panel: #0e1121; --panel2: #151933; --line: #2a2f52; --line2: #3a4170;
  --ink: #e9e4d4; --dim: #8b8aa8; --amber: #ffb03a; --core: #59f0b4; --bad: #ff4d6a; --warn: #ffe14d; --void: #b86cff; --cryo: #6ae2ff;
  --f-pix: 'Silkscreen', 'Courier New', monospace; --f-term: 'VT323', 'Courier New', monospace;
  --cut: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --rail: 56px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-term); font-size: 18px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button:disabled { cursor: default; opacity: 0.38; }
#app { position: fixed; left: 0; top: 0; width: calc(100vw / var(--ui, 1)); height: calc(var(--vvh, 100dvh) / var(--ui, 1)); overflow: hidden; transform: scale(var(--ui, 1)); transform-origin: 0 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar)); padding-block: 0; }
.svgi { display: block; width: 20px; height: 20px; shape-rendering: crispEdges; fill: currentColor; flex: 0 0 auto; }
.lbl { font-family: var(--f-pix); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.note { color: var(--dim); font-size: 17px; margin: 4px 0; }
.amber { color: var(--amber); } .void { color: #d6a6ff; } .good { color: var(--core); } .bad { color: var(--bad); } .dim { color: var(--dim); }
h2 { font-family: var(--f-pix); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; text-wrap: balance; }

/* ---------- buttons ---------- */
.btn { font-family: var(--f-pix); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--panel2); border: 0; padding: 10px 12px;
  clip-path: var(--cut); box-shadow: inset 0 0 0 2px var(--line2); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.btn small { font-family: var(--f-term); font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--dim); }
.btn.primary { background: var(--amber); color: #1a1004; box-shadow: none; }
.btn.primary small { color: #5a3a08; }
.btn.danger { box-shadow: inset 0 0 0 2px #6a2234; color: #ff9aac; }
.btn.small { padding: 7px 9px; font-size: 10px; }
.btn.wide { width: 100%; }
.btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(1.15); }
.chip { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; background: var(--panel); border: 0; padding: 7px 10px; min-height: 34px; min-width: 34px; box-shadow: inset 0 0 0 1px var(--line2); }
.chip.on { background: var(--c, var(--amber)); color: #0b0b12; box-shadow: none; }
.chip.hot:not(.on) { color: #ff9aac; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 18px; color: var(--dim); padding: 4px 6px; margin-left: auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* ---------- hangar: brand left, play in the right thumb zone, utilities top-right ---------- */
#bgfx { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
#hangar { padding-bottom: max(12px, var(--sab)); padding-top: max(12px, var(--sat)); }
#hangar .ver { position: absolute; z-index: 1; left: max(16px, var(--sal)); bottom: max(10px, var(--sab)); font-family: var(--f-pix); font-size: 9px; letter-spacing: 0.08em; color: var(--dim); opacity: 0.75; pointer-events: none; }
.hwrap { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) min(300px, 42%); grid-template-rows: auto 1fr auto; gap: 0 24px; max-width: 1000px; width: 100%; margin: 0 auto; }
.util { grid-column: 2; grid-row: 1; display: flex; gap: 8px; justify-content: flex-end; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel2); border: 0; clip-path: var(--cut); box-shadow: inset 0 0 0 1px var(--line2); color: #c9c6dc; }
.ib:active { filter: brightness(1.3); transform: translateY(1px); }
.brand { grid-column: 1; grid-row: 1 / 4; align-self: center; }
.brand h1 { font-family: var(--f-pix); font-weight: 700; font-size: clamp(40px, 8.4vw, 84px); line-height: 0.9; margin: 0; letter-spacing: 0.02em;
  text-shadow: 3px 0 0 var(--bad), -3px 0 0 var(--cryo), 0 0 28px rgba(255, 176, 58, 0.28); color: var(--ink); animation: glitch 6s infinite steps(1); }
@keyframes glitch { 0%, 92%, 100% { transform: none; } 93% { transform: translate(3px, -1px); } 95% { transform: translate(-2px, 1px); } 97% { transform: translate(1px, 0); } }
.hmeta { display: flex; gap: 28px; margin-top: 18px; align-items: flex-start; }
.hmeta > div { display: flex; flex-direction: column; gap: 2px; }
.hmeta b { font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.hmeta .lv b { color: var(--core); }
.xpbar { height: 4px; width: 64px; background: #11152a; box-shadow: inset 0 0 0 1px var(--line); position: relative; margin-top: 3px; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--core); }
.menu { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; gap: 8px; }
.menu .btn { flex-direction: row; justify-content: space-between; align-items: center; padding: 0 16px; min-height: 48px; font-size: 12px; text-align: left; }
.menu .btn.play { min-height: 66px; font-size: 17px; letter-spacing: 0.1em; }
.menu .btn small { font-size: 17px; text-align: right; }
.menu .btn.alt { min-height: 44px; }
.badge { font-style: normal; background: var(--core); color: #062018; font-family: var(--f-term); font-size: 17px; padding: 0 5px; line-height: 1.15; letter-spacing: 0; text-transform: none; }
.menu .btn.glow { box-shadow: inset 0 0 0 2px var(--core); }
.menu .btn.nova { min-height: 44px; color: #ffe9b0; background: linear-gradient(90deg, #2a1440, #3a1a2a); box-shadow: inset 0 0 0 1px #b86cff; }
.menu .btn.nova small { font-size: 15px; color: #c9a6ff; }
.menu .btn.nova.ready { color: #1a0a24; background: linear-gradient(90deg, #ffe9b0, #ff9adf, #b86cff); box-shadow: none; animation: pulse 1.6s infinite; }
.menu .btn.nova.ready small { color: #3a1450; }
#hNovaBox b { color: #ff9adf; }
.nova-card .ncards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
.ncard { text-align: left; border: 0; padding: 10px 11px; background: rgba(21, 25, 51, 0.92); color: var(--ink); box-shadow: inset 0 0 0 1px var(--c, #444a7a); clip-path: var(--cut); display: flex; flex-direction: column; gap: 4px; font-family: var(--f-term); font-size: 16px; line-height: 1.1; }
.ncard b { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c, #fff); }
.ncard .good { color: #59f0b4; } .ncard .bad { color: #ff8a9c; } .ncard small { color: #a9a7c4; font-size: 14px; }
.ncard.on { box-shadow: inset 0 0 0 2px var(--c, #fff); background: rgba(40, 34, 70, 0.96); }
.nkeep { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-family: var(--f-term); font-size: 16px; margin: 8px 0; }
.nkeep b { font-family: var(--f-pix); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 3px; }
.nkeep .lose b { color: #ff8a9c; } .nkeep .keep b { color: #59f0b4; }
#novafx { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe9b0 18%, #ff9adf 38%, rgba(184, 108, 255, 0.6) 60%, rgba(7, 8, 15, 0) 75%); animation: novaburst 1.6s ease-out forwards; }
@keyframes novaburst { 0% { opacity: 0; transform: scale(0.05); } 25% { opacity: 1; transform: scale(1.4); } 60% { opacity: 1; transform: scale(3); } 100% { opacity: 0; transform: scale(4); } }
.tip { text-decoration: underline dashed rgba(255, 255, 255, 0.55); text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: help; }
#tipbox { position: fixed; z-index: 300; background: rgba(8, 9, 20, 0.97); box-shadow: inset 0 0 0 1px var(--amber), 0 6px 18px rgba(0, 0, 0, 0.6); padding: calc(8px * var(--ui, 1)) calc(10px * var(--ui, 1)); font-family: var(--f-term); font-size: calc(16px * var(--ui, 1)); line-height: 1.15; color: var(--ink); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
#tipbox[hidden] { display: none; }
#tipbox b { font-family: var(--f-pix); font-size: calc(9px * var(--ui, 1)); letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); font-weight: 400; }
.hall { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.hrow { display: flex; align-items: center; gap: 10px; border: 0; text-align: left; padding: 7px 10px; background: rgba(21, 25, 51, 0.92); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); clip-path: var(--cut); }
.hrow:active { filter: brightness(1.3); }
.hrow em { font-style: normal; font-family: var(--f-pix); font-size: 12px; color: var(--amber); width: 24px; }
.hrow:first-child em { color: #ffe14d; }
.hrow span { flex: 1; display: flex; flex-direction: column; font-family: var(--f-term); }
.hrow b { font-weight: 400; font-size: 20px; line-height: 1; color: var(--amber); }
.hrow small { font-size: 14px; color: #a9a7c4; }
.hcast { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-term); font-size: 16px; margin-bottom: 6px; }
.hcast span { display: inline-flex; align-items: center; gap: 5px; } .hcast small { color: #a9a7c4; }
.rgn em { font-style: normal; margin-left: 6px; color: #ffe9b0; }
.tstar .srow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tstar .big { font-family: var(--f-term); font-size: 30px; color: var(--c); line-height: 1; }
.cloud { font-family: var(--f-pix); font-size: 9px; color: var(--dim); }
.cloud.on { color: var(--core); }

/* ---------- game: thin status bar on top, thumb rails left (abilities) and right (flow controls) ---------- */
#game { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail); grid-template-rows: 32px minmax(0, 1fr); gap: 0 6px;
  padding: 0 max(8px, var(--sar)) max(6px, var(--sab)) max(8px, var(--sal)); }
#hud { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; min-width: 0; padding-inline: 2px; }
.hs { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.hs b { font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.hs small { font-size: 17px; color: var(--dim); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hs.cr b { color: var(--amber); font-size: 24px; }
.corebox { display: flex; align-items: center; gap: 7px; }
#hpbar { width: clamp(64px, 12vw, 130px); height: 10px; background: #2a0a12; position: relative; box-shadow: inset 0 0 0 1px #5a1424; }
#hpbar i { position: absolute; left: 0; top: 0; bottom: 0; }
#hpfill { background: var(--core); box-shadow: 0 0 8px rgba(89, 240, 180, 0.5); }
#shfill { background: rgba(127, 212, 255, 0.9); height: 3px; bottom: auto !important; }
#hpbar.low #hpfill { background: var(--bad); animation: blink 0.5s infinite steps(1); }
@keyframes blink { 50% { opacity: 0.4; } }
#hptxt { font-size: 19px; font-variant-numeric: tabular-nums; }
.coin { display: inline-block; width: 8px; height: 8px; background: var(--amber); box-shadow: 1px 1px 0 #7a4a08; margin-right: 2px; align-self: center; }
.spacer { flex: 1; }
.hs.sc { margin-left: auto; }
.cashbtn { border: 0; background: var(--panel2); clip-path: var(--cut); box-shadow: inset 0 0 0 1px #6a4a18; padding: 0 10px; height: 30px; align-items: center; color: inherit; }
.cashbtn:active { filter: brightness(1.3); }
.cashtag { font-style: normal; font-family: var(--f-pix); font-size: 8px; text-transform: uppercase; color: var(--amber); letter-spacing: 0.06em; margin-left: 4px; }
.cashbtn.on { box-shadow: inset 0 0 0 2px var(--amber); }
.cashrate { display: flex; align-items: baseline; gap: 8px; background: var(--panel); padding: 8px 10px; box-shadow: inset 0 0 0 1px var(--line); }
.cashrate b { font-weight: 400; font-size: 26px; color: var(--amber); line-height: 1; }
.cashrate span { font-size: 16px; color: var(--dim); }
.cashopts { display: flex; flex-direction: column; gap: 5px; }
.cashopts .btn { flex-direction: row; justify-content: space-between; min-height: 46px; padding: 0 12px; }
.cashopts .btn small { font-size: 17px; }
#bCall.cp { color: var(--core); box-shadow: inset 0 0 0 2px var(--core); animation: pulse 1.4s infinite; }
#bCall.cp span { color: var(--core); }
@keyframes pulse { 50% { filter: brightness(1.35); } }
.cpbanner { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; pointer-events: none; background: rgba(7, 8, 15, 0.9); box-shadow: inset 0 0 0 1px var(--core); padding: 6px 12px; text-align: center; white-space: nowrap; }
.cpbanner b { display: block; font-family: var(--f-pix); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--core); }
.cpbanner span { font-size: 16px; color: var(--ink); }
.cpbar { display: block; height: 3px; margin-top: 4px; background: #0f2a22; position: relative; }
.cpbar i { position: absolute; inset: 0 auto 0 0; background: var(--core); }
body.panel-l .cpbanner { left: 72%; } body.panel-r .cpbanner { left: 28%; }
.dict-cats { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; margin: 0 0 8px; padding-bottom: 2px; touch-action: pan-x; }
.dict-cats::-webkit-scrollbar { display: none; }
.dict-cats .chip { flex: 0 0 auto; }
.dsearch { width: 100%; font: inherit; font-size: 18px; background: var(--panel2); color: var(--ink); border: 0; box-shadow: inset 0 0 0 1px var(--line2); padding: 7px 10px; margin-bottom: 8px; -webkit-user-select: text; user-select: text; }
.dict { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 6px 16px; align-items: baseline; }
.dict b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c, var(--amber)); }
.dict span { font-size: 17px; }
.dict span em { font-style: normal; color: var(--dim); }
.dict span .bad { color: #ff8a9c; }
.dict .dh2 { grid-column: 1 / -1; font-family: var(--f-pix); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
#stage { grid-column: 2; grid-row: 2; position: relative; min-height: 0; min-width: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
#stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 5, 12, 0.5) 100%); }
.rail { grid-row: 2; display: flex; flex-direction: column; gap: 6px; padding-block: 2px 0; min-height: 0; }
#railL { grid-column: 1; justify-content: flex-end; }
#railR { grid-column: 3; }
.rb { width: 100%; height: 46px; flex: 0 0 auto; background: var(--panel2); border: 0; clip-path: var(--cut); box-shadow: inset 0 0 0 1px var(--line2); color: #cfcce4;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; padding: 0; }
.rb span { font-family: var(--f-pix); font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); line-height: 1; }
.rb:active:not(:disabled) { filter: brightness(1.35); transform: translateY(1px); }
.rb .cnt { position: absolute; top: 3px; right: 4px; font-family: var(--f-term); font-style: normal; font-size: 16px; color: var(--warn); line-height: 1; }
.rb .badge { position: absolute; top: 3px; right: 3px; font-size: 15px; padding: 0 3px; }
.rb.on { box-shadow: inset 0 0 0 1px var(--cryo); color: var(--cryo); }
.abil { color: var(--warn); }
.abil.aim { background: var(--amber); color: #1a1004; box-shadow: none; }
.abil.aim span, .abil.aim .cnt { color: #1a1004; }
#bSpeed b { font-family: var(--f-term); font-weight: 400; font-size: 22px; line-height: 1; color: var(--ink); }
#bSpeed.fast b { color: var(--amber); }
#bCall { height: 60px; color: var(--amber); box-shadow: inset 0 0 0 2px var(--amber); }
#bCall span { color: var(--amber); font-size: 9px; }
#bCall b { font-family: var(--f-term); font-weight: 400; font-size: 18px; line-height: 1; }
#bCall:disabled { opacity: 1; color: #5a5470; box-shadow: inset 0 0 0 1px var(--line); }
#bCall:disabled span { color: #5a5470; }
#webBadge[hidden] { display: none; }
#chips { flex: 1; display: flex; gap: 5px; overflow-x: auto; min-width: 0; scrollbar-width: none; touch-action: pan-x; }
#chips::-webkit-scrollbar { display: none; }
.evchip { font-family: var(--f-pix); font-size: 9px; text-transform: uppercase; padding: 5px 6px; white-space: nowrap; box-shadow: inset 0 0 0 1px currentColor; }
.evchip.bad { color: #ff8a9c; } .evchip.good { color: var(--core); } .evchip.storm { color: var(--c); }
.evchip.warn.bad { background: #ff4d6a; color: #1a0610; box-shadow: none; animation: blink 0.8s infinite steps(1); }
.evchip.next { color: #c9c6bc; background: repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,0.04) 3px 6px); }
.evchip.next.bad { color: #ff8a9c; } .evchip.next.good { color: var(--core); }
.evchip.gene { color: var(--c); background: rgba(255,255,255,0.05); pointer-events: auto; }
.hs.pwr { display: flex; align-items: center; gap: 4px; color: #59f0b4; }
.hs.pwr b { font-size: 20px; }
.hs.pwr.full { color: #ffb03a; }
.hs.pwr .bolt { width: 8px; height: 12px; background: currentColor; clip-path: polygon(60% 0, 0 58%, 45% 58%, 30% 100%, 100% 40%, 55% 40%); }
.ph small.grid { margin-left: 8px; color: #59f0b4; font-family: var(--f-pix); font-size: 8px; } .ph small.grid.full { color: #ffb03a; }
.modes.oc .chip:disabled { opacity: 0.35; }
#toasts { position: absolute; top: 36px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 4px; align-items: center; pointer-events: none; z-index: 30; width: min(520px, 70%); }
body.modal-open #toasts { display: none; }
body.bossbar #toasts { top: 58px; }
body.panel-l #toasts { left: calc(50% + 140px); width: min(400px, 46%); }
body.panel-r #toasts { left: calc(50% - 140px); width: min(400px, 46%); }
.toast { background: rgba(7, 8, 15, 0.9); box-shadow: inset 0 0 0 1px var(--c), 0 0 18px rgba(0,0,0,0.5); padding: 4px 10px; display: flex; gap: 8px; align-items: baseline; animation: tin 0.2s; transition: opacity 0.4s; max-width: 100%; }
.toast b { font-family: var(--f-pix); font-size: 10px; color: var(--c); white-space: nowrap; }
.toast span { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.toast.out { opacity: 0; }
@keyframes tin { from { transform: translateY(-6px); opacity: 0; } }
#bossIntro { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 31; display: flex; gap: 14px; align-items: center; width: min(520px, 76%);
  background: linear-gradient(90deg, rgba(40,4,14,0.94), rgba(7,8,15,0.94)); box-shadow: inset 0 0 0 2px #ff3355, 0 0 40px rgba(255,51,85,0.35); padding: 12px 16px; animation: bossin 0.35s ease-out; }
#bossIntro[hidden] { display: none; }
#bossIntro.out { animation: bossout 0.35s ease-in forwards; }

  background: rgba(21, 25, 51, 0.92); border: 0; color: var(--amber); box-shadow: inset 0 0 0 1px var(--amber); clip-path: var(--cut); }

/* entropy gauge: vertical tube in the right rail */
.entg { height: 78px; flex: 0 0 auto; width: 100%; border: 0; background: var(--panel2); clip-path: var(--cut); box-shadow: inset 0 0 0 1px #4a2f74; position: relative; padding: 0; color: #d6a6ff; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; padding-bottom: 6px; overflow: hidden; }

/* ---------- side panel ---------- */
.panel { position: absolute; top: 4px; bottom: 4px; width: min(270px, 46%); background: rgba(12, 14, 28, 0.96); box-shadow: inset 0 0 0 1px var(--line2), 0 0 30px rgba(0, 0, 0, 0.6);

.panel.right { right: 0; } .panel.left { left: 0; }
.panel .x { width: 36px; height: 36px; margin: -4px -6px -4px auto; font-size: 20px; }
@keyframes pin { from { opacity: 0; } }
.ph { display: flex; align-items: center; gap: 8px; }
.ph b { font-family: var(--f-pix); font-size: 12px; text-transform: uppercase; }
.ph small { font-size: 15px; color: var(--dim); }
.pt { display: flex; flex-direction: column; min-width: 0; }
.ico { image-rendering: pixelated; flex: 0 0 auto; }
.blist { display: flex; flex-direction: column; gap: 4px; }

.bn { flex: 1; display: flex; flex-direction: column; font-size: 17px; min-width: 0; }
.bn small { font-family: var(--f-pix); font-size: 8px; text-transform: uppercase; color: var(--dim); }

.ph canvas.ico { width: 28px; height: 28px; }
.pfoot .btn { min-height: 44px; justify-content: center; }
.pfoot .row2 .btn { min-height: 40px; }

/* ---------- modal ---------- */

.card { background: var(--panel); box-shadow: inset 0 0 0 2px var(--line2); clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  padding: 14px 16px; width: min(720px, 100%); max-height: 100%; overflow-y: auto; touch-action: pan-y; }
.card.narrow { width: min(400px, 100%); }
.foot { position: sticky; bottom: -14px; margin: 10px -16px -14px; padding: 10px 16px 14px; background: linear-gradient(rgba(14, 17, 33, 0.8), var(--panel) 10px); display: flex; gap: 10px; justify-content: flex-end; align-items: center; z-index: 2; }

h2.void { color: #d6a6ff; }
.anlist { display: flex; flex-direction: column; gap: 4px; margin: 4px 0 10px; font-size: 15px; }

.elbar { display: flex; height: 8px; gap: 1px; }

.bigstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin: 6px 0 10px; }

  if (f >= 0.999) return { x0: 0, y0: 0, x1: COLS, y1: ROWS };

    { const hid = lastNode(); if (hid && pos[hid]) { const p = pos[hid], r = R[TREE.nodes[hid].kind] * p.s + 5 + (Math.sin(frame / 8) + 1) * 2; c.beginPath(); c.arc(p.x * 2, p.y * 2, r, 0, 6.283); c.strokeStyle = '#ffb03a'; c.globalAlpha = 0.85; c.lineWidth = 1.5; c.stroke();
      if (hereT > 0) { hereT--; const k = 1 - hereT / 90; c.beginPath(); c.arc(p.x * 2, p.y * 2, r + k * 60, 0, 6.283); c.globalAlpha = 1 - k; c.lineWidth = 2; c.stroke(); }
      c.globalAlpha = 1; } }
    const labels = [];
    for (const n of TREE.list) {
      const p = pos[n.id], rr = R[n.kind] * p.s;
      if (n.kind === 'small' ? rr < 7.5 : rr < 3) continue;
      if (cA > 0.5 && sel !== n.id && n.kind !== 'start') continue;
      const on = A.has(n.id), pri = (sel === n.id ? 100 : 0) + (on ? 20 : 0) + ({ keystone: 50, mastery: 30, notable: 25, orbit: 35, sat: 22, start: 60, small: 0 }[n.kind]) + (Pth.has(n.id) ? 10 : 0) + p.d * 0.01;
      labels.push({ n, x: p.x * 2, y: p.y * 2 + rr + 5, pri, on });

    labels.sort((a, b) => b.pri - a.pri);

    c.textAlign = 'center'; c.textBaseline = 'top';
    for (const L of labels) {
      const n = L.n, fs = n.kind === 'small' ? 10 : n.kind === 'keystone' ? 12 : 11;
      c.font = `${fs}px Silkscreen, monospace`;
      const txt = n.name.toUpperCase(), w = c.measureText(txt).width + 6, h = fs + 4;
      const box = { x0: L.x - w / 2, x1: L.x + w / 2, y0: L.y - 2, y1: L.y + h };
      if (box.y0 < 52 || box.y1 > H || box.x1 < 0 || box.x0 > W) continue;
      if (placed.some(q => q.x0 < box.x1 && q.x1 > box.x0 && q.y0 < box.y1 && q.y1 > box.y0)) continue;
      placed.push(box);
      c.fillStyle = 'rgba(4,5,10,0.72)'; c.fillRect(box.x0, box.y0, w, h);
      c.fillStyle = L.on ? '#ffffff' : n.kind === 'keystone' ? '#ffb03a' : n.col && (n.kind === 'orbit' || n.kind === 'sat') ? n.col : '#a9a7c4';
      c.fillText(txt, L.x, L.y);
    }
    c.font = '12px Silkscreen, monospace';
    for (const L of cLabels) {
      c.globalAlpha = cA;
      const w = c.measureText(L.txt).width + 8, box = { x0: L.x - w / 2, x1: L.x + w / 2, y0: L.y - 8, y1: L.y + 8 };
      if (box.y0 < 52 || box.y1 > H - 40 || box.x1 < 0 || box.x0 > W) continue;
      if (placed.some(q => q.x0 < box.x1 && q.x1 > box.x0 && q.y0 < box.y1 && q.y1 > box.y0)) continue;
      placed.push(box);
      c.globalAlpha = cA * (L.full ? 1 : L.on ? 0.9 : 0.6); c.fillStyle = L.on ? L.col : '#a9a7c4'; c.textBaseline = 'middle';

    }

  }
  const sh2Cache = {};
  function sh2(col) { if (sh2Cache[col]) return sh2Cache[col]; const v = parseInt(col.slice(1), 16), r = (v >> 16 & 255) * 0.42, g = (v >> 8 & 255) * 0.42, b = (v & 255) * 0.5; return (sh2Cache[col] = `rgb(${r | 0},${g | 0},${b | 0})`); }
  function select(id) { const n = TREE.nodes[id]; if (!n) return; if (!cam) cam = DEF(); sel = id; path = treePathTo(id); const [x, y, z] = npos(n); cam.tx = x; cam.ty = y; cam.tz = z * 0.85; goal = null; refresh(); }
  return { init, open, close, resize, draw, refresh, select, get isOpen() { return open_; } };
})();

// ---------------- Main loop ----------------
(function boot() {
  const loaded = Save.loadLocal();
  if (loaded) PROF = loaded;
  const webReset = migrateWeb();
  if (webReset) { Save.save(); setTimeout(() => UI.toast('PASSIVE WEB REBUILT', 'Fewer, stronger nodes. All your points are refunded.', '#ffb03a'), 900); }
  Render.init($('#cv'));
  Render.onCam = () => UI.zoomChanged && UI.zoomChanged();
  Tree.init();
  hydrateIcons();
  UI.wire();
  UI.renderHangar();
  UI.show('hangar');
  // returning players see what changed once per version; brand-new players skip it
  if (!PROF.runs) { PROF.seenVer = VERSION; }
  else if (PROF.seenVer !== VERSION) setTimeout(() => { if (UI.screen === 'hangar' && !UI.modalOpen && WHATS_NEW.items.length) UI.openNews(); }, 900);
  SFX.setVolumes(PROF.settings.sfx, PROF.settings.music);
  SFX.setSoundtrack(PROF.settings.soundtrack || 'ec');
  Save.initRemote();
  // Home Screen copy: notice a newer release (Pages caches pages for ~10 min, and iOS keeps the app in memory)
  // and reload onto it from the main menu, never mid-run
  let updTo = null, updAt = 0;
  function checkUpdate() {
    if (!/github\.io$/.test(location.hostname) || !window.fetch) return;
    const now = Date.now(); if (now - updAt < 60000) return; updAt = now;
    fetch(location.pathname, { cache: 'reload' }).then(r => r.ok ? r.text() : '').then(t => {
      const m = t.match(/const VERSION = '([0-9.]+)'/);
      if (m && m[1] !== VERSION) updTo = m[1];
    }).catch(() => {});
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  setInterval(() => {
    if (!updTo || UI.screen !== 'hangar' || UI.modalOpen || Tree.isOpen) return;
    let tried = null; try { tried = sessionStorage.getItem('entropy.upd'); } catch (e) {}
    if (tried === updTo) { updTo = null; return; } // already reloaded for this one; don't loop
    try { sessionStorage.setItem('entropy.upd', updTo); } catch (e) {}
    UI.toast('UPDATING', 'Version ' + updTo, '#59f0b4', true);
    Save.save(); if (Save.flushNow) Save.flushNow();
    updTo = null; setTimeout(() => location.reload(), 900);
  }, 1000);
  // hangar backdrop
  const bg = $('#bgfx'), bc = bg.getContext('2d');
  let bt = 0;
  const stars = Array.from({ length: 70 }, () => ({ x: Math.random(), y: Math.random(), p: Math.random() * 6.28, c: ['#59f0b4', '#ffb03a', '#b86cff', '#6ae2ff', '#ff4d6a'][Math.floor(Math.random() * 5)] }));
  function drawBg(dt) {
    bt += dt;
    const r = bg.getBoundingClientRect();
    if (bg.width !== Math.round(r.width / 4) || bg.height !== Math.round(r.height / 4)) { bg.width = Math.max(1, Math.round(r.width / 4)); bg.height = Math.max(1, Math.round(r.height / 4)); }
    bc.fillStyle = 'rgba(7,8,15,0.35)'; bc.fillRect(0, 0, bg.width, bg.height);
    const cx = bg.width * 0.72, cy = bg.height * 0.5;
    for (let a = 0; a < 3; a++) for (let k = 0; k < 40; k++) {
      const rr = k * Math.min(bg.width, bg.height) / 70, an = bt * 0.4 + a * 2.09 + k * 0.18;
      bc.fillStyle = ['#b86cff', '#ff4d6a', '#ffb03a'][a] + '88';
      bc.fillRect(Math.round(cx + Math.cos(an) * rr), Math.round(cy + Math.sin(an) * rr), 1, 1);
    }
    for (const s of stars) { s.p += dt * 2; if (Math.sin(s.p) > 0.6) { bc.fillStyle = s.c; bc.fillRect(Math.floor(s.x * bg.width), Math.floor(s.y * bg.height), 1, 1); } }
  }
  let last = performance.now(), acc = 0;
  const STEP = 1 / 30;
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts;
    if (UI.screen === 'game' && G) {
      if (G.checkpoint && !G.paused && !G.reloc && UI.modalOpen !== 'pause' && !document.hidden) G.cpT += dt;
      if (UI.slowmo > 0) UI.slowmo -= dt;
      const halted = G.over || G.paused || G.draft || (G.checkpoint && !G.enemies.length) || Tree.isOpen || UI.modalOpen;
      if (!halted) {
        acc += dt * G.speed * (UI.slowmo > 0 ? 0.3 : 1);
        let n = 0;
        while (acc >= STEP && n < 10) { simStep(STEP); acc -= STEP; n++; }
        if (n >= 10) acc = 0;
      }
      Render.draw(halted ? 0 : dt);
    } else if (UI.screen === 'hangar') drawBg(dt);
    if (Tree.isOpen) Tree.draw();
    UI.tick(dt);
  }
  requestAnimationFrame(frame);
})();

</script>
