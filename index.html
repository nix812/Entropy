<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Entropy">
<meta name="theme-color" content="#07080f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>Entropy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=VT323&display=swap">
<style>
/* Layout: one-screen arcade cabinet — HUD rail on top, playfield, ability rail below; overlays slide in from the side away from the tapped tile */
:root {
  --bg: #07080f; --panel: #0e1121; --panel2: #151933; --line: #2a2f52; --line2: #3a4170;
  --ink: #e9e4d4; --dim: #8b8aa8; --amber: #ffb03a; --core: #59f0b4; --bad: #ff4d6a; --warn: #ffe14d; --void: #b86cff; --cryo: #6ae2ff;
  --f-pix: 'Silkscreen', 'Courier New', monospace; --f-term: 'VT323', 'Courier New', monospace;
  --cut: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px); --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --rail: 56px;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html { box-sizing: border-box; height: 100%; background: var(--bg); }
*, *::before, *::after { box-sizing: inherit; }
body { height: 100%; margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-term); font-size: 18px; line-height: 1.15;
  overflow: hidden; overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }
button:disabled { cursor: default; opacity: 0.38; }
#app { position: fixed; left: 0; top: 0; width: calc(100vw / var(--ui, 1)); height: calc(var(--vvh, 100dvh) / var(--ui, 1)); overflow: hidden; transform: scale(var(--ui, 1)); transform-origin: 0 0; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar)); padding-block: 0; }
.svgi { display: block; width: 20px; height: 20px; shape-rendering: crispEdges; fill: currentColor; flex: 0 0 auto; }
.lbl { font-family: var(--f-pix); font-size: 9px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); line-height: 1.5; }
.note { color: var(--dim); font-size: 17px; margin: 4px 0; }
.amber { color: var(--amber); } .void { color: #d6a6ff; } .good { color: var(--core); } .bad { color: var(--bad); } .dim { color: var(--dim); }
h2 { font-family: var(--f-pix); font-weight: 700; font-size: 15px; letter-spacing: 0.06em; text-transform: uppercase; margin: 0; text-wrap: balance; }

/* ---------- buttons ---------- */
.btn { font-family: var(--f-pix); font-size: 11px; letter-spacing: 0.05em; text-transform: uppercase; background: var(--panel2); border: 0; padding: 10px 12px;
  clip-path: var(--cut); box-shadow: inset 0 0 0 2px var(--line2); display: flex; flex-direction: column; align-items: center; gap: 3px; }
.btn small { font-family: var(--f-term); font-size: 15px; text-transform: none; letter-spacing: 0; color: var(--dim); }
.btn.primary { background: var(--amber); color: #1a1004; box-shadow: none; }
.btn.primary small { color: #5a3a08; }
.btn.danger { box-shadow: inset 0 0 0 2px #6a2234; color: #ff9aac; }
.btn.small { padding: 7px 9px; font-size: 10px; }
.btn.wide { width: 100%; }
.btn:active:not(:disabled) { transform: translateY(1px); filter: brightness(1.15); }
.chip { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; background: var(--panel); border: 0; padding: 7px 10px; min-height: 34px; min-width: 34px; box-shadow: inset 0 0 0 1px var(--line2); }
.chip.on { background: var(--c, var(--amber)); color: #0b0b12; box-shadow: none; }
.chip.hot:not(.on) { color: #ff9aac; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.x { background: none; border: 0; font-size: 18px; color: var(--dim); padding: 4px 6px; margin-left: auto; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 8px; }

/* ---------- hangar: brand left, play in the right thumb zone, utilities top-right ---------- */
#bgfx { position: absolute; inset: 0; width: 100%; height: 100%; image-rendering: pixelated; z-index: 0; }
#hangar { padding-bottom: max(12px, var(--sab)); padding-top: max(12px, var(--sat)); }
#hangar .ver { position: absolute; z-index: 1; left: max(16px, var(--sal)); bottom: max(10px, var(--sab)); font-family: var(--f-pix); font-size: 9px; letter-spacing: 0.08em; color: var(--dim); opacity: 0.75; pointer-events: none; }
.hwrap { position: relative; z-index: 1; flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) min(300px, 42%); grid-template-rows: auto 1fr auto; gap: 0 24px; max-width: 1000px; width: 100%; margin: 0 auto; }
.util { grid-column: 2; grid-row: 1; display: flex; gap: 8px; justify-content: flex-end; }
.ib { width: 44px; height: 44px; display: grid; place-items: center; background: var(--panel2); border: 0; clip-path: var(--cut); box-shadow: inset 0 0 0 1px var(--line2); color: #c9c6dc; }
.ib:active { filter: brightness(1.3); transform: translateY(1px); }
.brand { grid-column: 1; grid-row: 1 / 4; align-self: center; }
.brand h1 { font-family: var(--f-pix); font-weight: 700; font-size: clamp(40px, 8.4vw, 84px); line-height: 0.9; margin: 0; letter-spacing: 0.02em;
  text-shadow: 3px 0 0 var(--bad), -3px 0 0 var(--cryo), 0 0 28px rgba(255, 176, 58, 0.28); color: var(--ink); }
.brand h1.gl { animation: glitch 0.34s steps(1); } /* v5.5: the backdrop tears and the title jumps with it */
@keyframes glitch { 0%, 100% { transform: none; } 12% { transform: translate(3px, -1px); text-shadow: 5px 0 0 var(--bad), -4px 0 0 var(--cryo), 0 0 28px rgba(255, 176, 58, 0.28); } 40% { transform: translate(-2px, 1px); } 70% { transform: translate(1px, 0); } }
.hmeta { display: flex; gap: 28px; margin-top: 18px; align-items: flex-start; }
.hmeta > div { display: flex; flex-direction: column; gap: 2px; }
.hmeta b { font-weight: 400; font-size: 30px; line-height: 1; font-variant-numeric: tabular-nums; }
.hmeta .lv b { color: var(--core); }
.xpbar { height: 4px; width: 64px; background: #11152a; box-shadow: inset 0 0 0 1px var(--line); position: relative; margin-top: 3px; }
.xpbar i { position: absolute; inset: 0 auto 0 0; background: var(--core); }
.menu { grid-column: 2; grid-row: 3; display: flex; flex-direction: column; gap: 8px; }
.menu .btn { flex-direction: row; justify-content: space-between; align-items: center; padding: 0 16px; min-height: 48px; font-size: 12px; text-align: left; }
.menu .btn.play { min-height: 66px; font-size: 17px; letter-spacing: 0.1em; }
.menu .btn small { font-size: 17px; text-align: right; }
.menu .btn.alt { min-height: 44px; }
.badge { font-style: normal; background: var(--core); color: #062018; font-family: var(--f-term); font-size: 17px; padding: 0 5px; line-height: 1.15; letter-spacing: 0; text-transform: none; }
.menu .btn.glow { box-shadow: inset 0 0 0 2px var(--core); }
.menu .btn.nova { min-height: 44px; color: #ffe9b0; background: linear-gradient(90deg, #2a1440, #3a1a2a); box-shadow: inset 0 0 0 1px #b86cff; }
.menu .btn.nova small { font-size: 15px; color: #c9a6ff; }
.menu .btn.nova.ready { color: #1a0a24; background: linear-gradient(90deg, #ffe9b0, #ff9adf, #b86cff); box-shadow: none; animation: pulse 1.6s infinite; }
.menu .btn.nova.ready small { color: #3a1450; }
#hNovaBox b { color: #ff9adf; }
.nova-card .ncards { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; margin: 10px 0; }
.ncard { text-align: left; border: 0; padding: 10px 11px; background: rgba(21, 25, 51, 0.92); color: var(--ink); box-shadow: inset 0 0 0 1px var(--c, #444a7a); clip-path: var(--cut); display: flex; flex-direction: column; gap: 4px; font-family: var(--f-term); font-size: 16px; line-height: 1.1; }
.ncard b { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--c, #fff); }
.ncard .good { color: #59f0b4; } .ncard .bad { color: #ff8a9c; } .ncard small { color: #a9a7c4; font-size: 14px; }
.ncard.on { box-shadow: inset 0 0 0 2px var(--c, #fff); background: rgba(40, 34, 70, 0.96); }
.nkeep { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px; font-family: var(--f-term); font-size: 16px; margin: 8px 0; }
.nkeep b { font-family: var(--f-pix); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; display: block; margin-bottom: 3px; }
.nkeep .lose b { color: #ff8a9c; } .nkeep .keep b { color: #59f0b4; }
#novafx { position: fixed; inset: 0; z-index: 200; pointer-events: none; background: radial-gradient(circle at 50% 50%, #ffffff 0%, #ffe9b0 18%, #ff9adf 38%, rgba(184, 108, 255, 0.6) 60%, rgba(7, 8, 15, 0) 75%); animation: novaburst 1.6s ease-out forwards; }
@keyframes novaburst { 0% { opacity: 0; transform: scale(0.05); } 25% { opacity: 1; transform: scale(1.4); } 60% { opacity: 1; transform: scale(3); } 100% { opacity: 0; transform: scale(4); } }
.tip { text-decoration: underline dashed rgba(255, 255, 255, 0.55); text-underline-offset: 3px; text-decoration-thickness: 1px; cursor: help; }
#tipbox { position: fixed; z-index: 300; background: rgba(8, 9, 20, 0.97); box-shadow: inset 0 0 0 1px var(--amber), 0 6px 18px rgba(0, 0, 0, 0.6); padding: calc(8px * var(--ui, 1)) calc(10px * var(--ui, 1)); font-family: var(--f-term); font-size: calc(16px * var(--ui, 1)); line-height: 1.15; color: var(--ink); display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
#tipbox[hidden] { display: none; }
#tipbox b { font-family: var(--f-pix); font-size: calc(9px * var(--ui, 1)); letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); font-weight: 400; }
.hall { display: flex; flex-direction: column; gap: 5px; margin-bottom: 10px; }
.hrow { display: flex; align-items: center; gap: 10px; border: 0; text-align: left; padding: 7px 10px; background: rgba(21, 25, 51, 0.92); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line2); clip-path: var(--cut); }
.hrow:active { filter: brightness(1.3); }
.hrow em { font-style: normal; font-family: var(--f-pix); font-size: 12px; color: var(--amber); width: 24px; }
.hrow:first-child em { color: #ffe14d; }
.hrow span { flex: 1; display: flex; flex-direction: column; font-family: var(--f-term); }
.hrow b { font-weight: 400; font-size: 20px; line-height: 1; color: var(--amber); }
.hrow small { font-size: 14px; color: #a9a7c4; }
.hcast { display: flex; flex-wrap: wrap; gap: 6px 14px; font-family: var(--f-term); font-size: 16px; margin-bottom: 6px; }
.hcast span { display: inline-flex; align-items: center; gap: 5px; } .hcast small { color: #a9a7c4; }
.rgn em { font-style: normal; margin-left: 6px; color: #ffe9b0; }
.tstar .srow { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.tstar .big { font-family: var(--f-term); font-size: 30px; color: var(--c); line-height: 1; }
.cloud { font-family: var(--f-pix); font-size: 9px; color: var(--dim); }
.cloud.on { color: var(--core); }

/* ---------- game: thin status bar on top, thumb rails left (abilities) and right (flow controls) ---------- */
#game { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr) var(--rail); grid-template-rows: 32px minmax(0, 1fr); gap: 0 6px;
  padding: 0 max(8px, var(--sar)) max(6px, var(--sab)) max(8px, var(--sal)); }
#hud { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; min-width: 0; padding-inline: 2px; }
.hs { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
.hs b { font-weight: 400; font-size: 22px; font-variant-numeric: tabular-nums; line-height: 1; white-space: nowrap; }
.hs small { font-size: 17px; color: var(--dim); line-height: 1; white-space: nowrap; font-variant-numeric: tabular-nums; }
.hs.cr b { color: var(--amber); font-size: 24px; }
.corebox { display: flex; align-items: center; gap: 7px; }
#hpbar { width: clamp(64px, 12vw, 130px); height: 10px; background: #2a0a12; position: relative; box-shadow: inset 0 0 0 1px #5a1424; }
#hpbar i { position: absolute; left: 0; top: 0; bottom: 0; }
#hpfill { background: var(--core); box-shadow: 0 0 8px rgba(89, 240, 180, 0.5); }
#shfill { background: rgba(127, 212, 255, 0.9); height: 3px; bottom: auto !important; }
#hpbar.low #hpfill { background: var(--bad); animation: blink 0.5s infinite steps(1); }
@keyframes blink { 50% { opacity: 0.4; } }
#hptxt { font-size: 19px; font-variant-numeric: tabular-nums; }
.coin { display: inline-block; width: 8px; height: 8px; background: var(--amber); box-shadow: 1px 1px 0 #7a4a08; margin-right: 2px; align-self: center; }
.spacer { flex: 1; }
.hs.sc { margin-left: auto; }
.cashbtn { border: 0; background: var(--panel2); clip-path: var(--cut); box-shadow: inset 0 0 0 1px #6a4a18; padding: 0 10px; height: 30px; align-items: center; color: inherit; }
.cashbtn:active { filter: brightness(1.3); }
.cashtag { font-style: normal; font-family: var(--f-pix); font-size: 8px; text-transform: uppercase; color: var(--amber); letter-spacing: 0.06em; margin-left: 4px; }
.cashbtn.on { box-shadow: inset 0 0 0 2px var(--amber); }
.cashrate { display: flex; align-items: baseline; gap: 8px; background: var(--panel); padding: 8px 10px; box-shadow: inset 0 0 0 1px var(--line); }
.cashrate b { font-weight: 400; font-size: 26px; color: var(--amber); line-height: 1; }
.cashrate span { font-size: 16px; color: var(--dim); }
.cashopts { display: flex; flex-direction: column; gap: 5px; }
.cashopts .btn { flex-direction: row; justify-content: space-between; min-height: 46px; padding: 0 12px; }
.cashopts .btn small { font-size: 17px; }
/* v4.4 Black Market */
.mline { font-style: italic; color: var(--dim); text-transform: none; letter-spacing: 0; font-family: var(--f-term); font-size: 14px; }
.mktlist { display: flex; flex-direction: column; gap: 5px; }
.mkt { display: grid; grid-template-columns: 1fr auto; grid-template-areas: "n p" "d p"; gap: 0 10px; text-align: left; background: var(--panel); box-shadow: inset 3px 0 0 var(--c, var(--amber)), inset 0 0 0 1px var(--line); padding: 6px 10px; color: var(--ink); min-height: 46px; }
.mkt b { grid-area: n; font-family: var(--f-pix); font-size: 9px; letter-spacing: 1px; color: var(--c, var(--amber)); }
.mkt span { grid-area: d; font-size: 15px; line-height: 1.15; color: #c9c6bc; }
.mkt em { grid-area: p; align-self: center; font-style: normal; font-size: 20px; color: var(--amber); white-space: nowrap; }
.mkt:disabled { opacity: 0.55; } .mkt.sold em { color: var(--dim); text-decoration: line-through; } .mkt em.poor { color: var(--bad); }
#bCall.cp { color: var(--core); box-shadow: inset 0 0 0 2px var(--core); animation: pulse 1.4s infinite; }
#bCall.cp span { color: var(--core); }
@keyframes pulse { 50% { filter: brightness(1.35); } }
.cpbanner { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 5; pointer-events: none; background: rgba(7, 8, 15, 0.9); box-shadow: inset 0 0 0 1px var(--core); padding: 6px 12px; text-align: center; white-space: nowrap; }
.cpbanner b { display: block; font-family: var(--f-pix); font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--core); }
.cpbanner span { font-size: 16px; color: var(--ink); }
.cpbar { display: block; height: 3px; margin-top: 4px; background: #0f2a22; position: relative; }
.cpbar i { position: absolute; inset: 0 auto 0 0; background: var(--core); }
body.panel-l .cpbanner { left: 72%; } body.panel-r .cpbanner { left: 28%; }
.dict-cats { display: flex; gap: 5px; overflow-x: auto; scrollbar-width: none; margin: 0 0 8px; padding-bottom: 2px; touch-action: pan-x; }
.dict-cats::-webkit-scrollbar { display: none; }
.dict-cats .chip { flex: 0 0 auto; }
.dsearch { width: 100%; font: inherit; font-size: 18px; background: var(--panel2); color: var(--ink); border: 0; box-shadow: inset 0 0 0 1px var(--line2); padding: 7px 10px; margin-bottom: 8px; -webkit-user-select: text; user-select: text; }
.dict { display: grid; grid-template-columns: minmax(110px, max-content) minmax(0, 1fr); gap: 6px 16px; align-items: baseline; }
.dict b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; letter-spacing: 0.05em; text-transform: uppercase; color: var(--c, var(--amber)); }
.dict span { font-size: 17px; }
.dict span em { font-style: normal; color: var(--dim); }
.dict span .bad { color: #ff8a9c; }
.dict .dh2 { grid-column: 1 / -1; font-family: var(--f-pix); font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 6px; }
#stage { grid-column: 2; grid-row: 2; position: relative; min-height: 0; min-width: 0; }
#cv { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; image-rendering: pixelated; }
#stage::after { content: ''; position: absolute; inset: 0; pointer-events: none; z-index: 2; background: radial-gradient(ellipse at center, transparent 55%, rgba(4, 5, 12, 0.5) 100%); }
.rail { grid-row: 2; display: flex; flex-direction: column; gap: 6px; padding-block: 2px 0; min-height: 0; }
#railL { grid-column: 1; justify-content: flex-end; }
#railR { grid-column: 3; }
.rb { width: 100%; height: 46px; flex: 0 0 auto; background: var(--panel2); border: 0; clip-path: var(--cut); box-shadow: inset 0 0 0 1px var(--line2); color: #cfcce4;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; position: relative; padding: 0; }
.rb span { font-family: var(--f-pix); font-size: 8px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--dim); line-height: 1; }
.rb:active:not(:disabled) { filter: brightness(1.35); transform: translateY(1px); }
.rb .cnt { position: absolute; top: 3px; right: 4px; font-family: var(--f-term); font-style: normal; font-size: 16px; color: var(--warn); line-height: 1; }
.rb .badge { position: absolute; top: 3px; right: 3px; font-size: 15px; padding: 0 3px; }
.rb.on { box-shadow: inset 0 0 0 1px var(--cryo); color: var(--cryo); }
.abil { color: var(--warn); }
.abil.aim { background: var(--amber); color: #1a1004; box-shadow: none; }
/* v5.1 Know Your Enemy */
.sts.erow { padding-left: 10px; }
.ehp { position: relative; height: 18px; background: #2a0a12; box-shadow: inset 0 0 0 1px #5a1424; margin: 2px 0 6px; }
.ehp i { position: absolute; inset: 0 auto 0 0; background: var(--bad); }
.ehp span { position: relative; display: block; text-align: center; font-size: 16px; line-height: 18px; color: #fff; text-shadow: 1px 1px 0 #000; font-variant-numeric: tabular-nums; }
.etag { font-style: normal; color: var(--dim); white-space: nowrap; }
.etag.bad { color: var(--bad); }
canvas.eico { width: 32px; height: 32px; image-rendering: pixelated; background: var(--panel2); }
#etip { position: absolute; z-index: 6; pointer-events: none; max-width: 220px; background: rgba(7, 8, 15, 0.94); box-shadow: inset 0 0 0 1px var(--line2); padding: 5px 8px; }
#etip[hidden] { display: none; }
#etip b { display: block; font-family: var(--f-pix); font-weight: 400; font-size: 9px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); }
#etip span { display: block; font-size: 15px; line-height: 1.15; color: var(--ink); }
.ecard { text-align: left; }
.ecard .erow { display: grid; grid-template-columns: 88px minmax(0, 1fr); gap: 12px; align-items: center; }
.card.ecard .erow canvas { width: 88px !important; height: 88px !important; image-rendering: pixelated; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); }
.ecard p { margin: 0 0 6px; }
.dict b canvas.dico { width: 22px; height: 22px; image-rendering: pixelated; vertical-align: middle; margin-right: 6px; }
.abil .cdf { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--warn); pointer-events: none; }
.abil.empty, .abil.locked { color: #6a6584; }
.abil.empty svg, .abil.locked svg { opacity: 0.45; }
.abil.locked { box-shadow: inset 0 0 0 1px var(--line); }
.abil .cnt.extra { color: var(--amber); }
.abil.want { box-shadow: inset 0 0 0 2px #7dffb0, 0 0 14px rgba(125, 255, 176, 0.5); animation: pulse 1s infinite; }
.abil.want span { color: #7dffb0; }
.abil .dur { position: absolute; left: 0; top: 0; height: 3px; width: 0; background: var(--core); pointer-events: none; }
.abil.live { box-shadow: inset 0 0 0 2px var(--core), 0 0 10px rgba(89, 240, 180, 0.35); }
.abil.live span { color: var(--core); font-family: var(--f-term); font-size: 17px; letter-spacing: 0; text-transform: none; font-variant-numeric: tabular-nums; }

input[type=range]::-webkit-slider-runnable-track { height: 8px; background: linear-gradient(to right, var(--fc) 0 var(--p, 50%), #232845 var(--p, 50%) 100%); box-shadow: inset 0 0 0 1px rgba(0,0,0,0.5), 0 1px 0 rgba(255,255,255,0.06); }
input[type=range]::-moz-range-track { height: 8px; background: linear-gradient(to right, var(--fc) 0 var(--p, 50%), #232845 var(--p, 50%) 100%); }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 16px; height: 24px; margin-top: -8px; background: var(--ink); border: 0; box-shadow: inset 0 -3px 0 rgba(0,0,0,0.3), 0 0 0 2px #090b16; }
input[type=range]::-moz-range-thumb { width: 16px; height: 24px; background: var(--ink); border: 0; border-radius: 0; box-shadow: 0 0 0 2px #090b16; }
input[type=range]:active::-webkit-slider-thumb { background: #fff; transform: scaleY(1.1); }
.xcode { width: 100%; height: 110px; margin-top: 8px; font: 13px/1.2 ui-monospace, monospace; background: var(--panel2); color: var(--ink); border: 0; box-shadow: inset 0 0 0 1px var(--line2); padding: 8px; resize: none; word-break: break-all; -webkit-user-select: text; user-select: text; }
.gtabs { margin: -2px 0 10px; }
.gd { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 5px 16px; align-items: baseline; }
.gd b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; letter-spacing: 0.06em; text-transform: uppercase; color: var(--amber); }
.gd span { font-size: 18px; color: var(--ink); }
.gsub { margin: 12px 0 4px; }
.gcombo { display: grid; grid-template-columns: repeat(2, max-content minmax(0, 1fr)); gap: 3px 14px; align-items: baseline; font-size: 17px; }
.gcombo span { color: var(--dim); } .gcombo span i { font-style: normal; color: #5f5d7a; }
.gcombo b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; text-transform: uppercase; color: var(--ink); }
@media (max-width: 700px) { .gcombo { grid-template-columns: max-content minmax(0, 1fr); } }
.help ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 17px; max-width: 70ch; }
.arow { display: flex; align-items: center; gap: 8px; font-size: 17px; padding: 2px 0; }
.arow small { font-family: var(--f-pix); font-size: 8px; text-transform: uppercase; }
.arow em { margin-left: auto; font-style: normal; color: var(--dim); font-size: 15px; }
.arow.dim { opacity: 0.45; }

/* ---------- bevels: chunky retro buttons with a lit top edge and a shaded base ---------- */
.rb, .hbtn, .ib, .entg { box-shadow: inset 0 0 0 1px var(--line2), inset 0 2px 0 rgba(255, 255, 255, 0.07), inset 0 -3px 0 rgba(0, 0, 0, 0.38); }
.btn:not(.primary):not(.danger) { box-shadow: inset 0 0 0 2px var(--line2), inset 0 3px 0 rgba(255, 255, 255, 0.06), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.btn.primary { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.38), inset 0 -3px 0 rgba(110, 55, 0, 0.5); }
.btn.danger { box-shadow: inset 0 0 0 2px #6a2234, inset 0 2px 0 rgba(255, 255, 255, 0.05), inset 0 -3px 0 rgba(0, 0, 0, 0.35); }
.rb:active:not(:disabled), .btn:active:not(:disabled), .ib:active { box-shadow: inset 0 0 0 1px var(--line2), inset 0 3px 0 rgba(0, 0, 0, 0.4); }
.rb.on { box-shadow: inset 0 0 0 1px var(--cryo), inset 0 2px 0 rgba(255, 255, 255, 0.07), inset 0 -3px 0 rgba(0, 0, 0, 0.38); }
#bCall:not(:disabled) { box-shadow: inset 0 0 0 2px var(--amber), inset 0 -3px 0 rgba(0, 0, 0, 0.38); }
#bCall.cp { box-shadow: inset 0 0 0 2px var(--core), inset 0 -3px 0 rgba(0, 0, 0, 0.38); }
.entg { box-shadow: inset 0 0 0 1px #4a2f74, inset 0 2px 0 rgba(255, 255, 255, 0.06), inset 0 -3px 0 rgba(0, 0, 0, 0.38); }
.entg.ready { box-shadow: inset 0 2px 0 rgba(255, 255, 255, 0.35), inset 0 -3px 0 rgba(40, 0, 80, 0.5); }
.bt { box-shadow: inset 0 0 0 1px var(--line), inset 0 -2px 0 rgba(0, 0, 0, 0.35); }
.bt.on { box-shadow: inset 0 0 0 2px var(--amber), inset 0 -2px 0 rgba(0, 0, 0, 0.35); }

/* ---------- passive web ---------- */
.hbtn { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; background: var(--panel2); border: 0; height: 36px; min-width: 44px; padding: 0 11px; clip-path: var(--cut); box-shadow: inset 0 0 0 1px var(--line2); display: flex; align-items: center; justify-content: center; gap: 5px; position: relative; }
.hbtn:active { filter: brightness(1.3); }
#tree { padding-left: 0; padding-right: 0; z-index: 15; background: #06070d; }
#tbar { position: relative; z-index: 2; display: flex; align-items: center; gap: 12px; height: 52px; padding-left: max(16px, var(--sal)); padding-right: max(16px, var(--sar)); padding-block: 0; background: #06070d; box-shadow: 0 1px 0 var(--line); }
#tbar .hbtn { height: 40px; padding: 0 9px; }
#tbar h2 { font-size: 13px; }
.tpts { font-family: var(--f-pix); font-size: 10px; color: var(--dim); display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.tpts b { font-family: var(--f-term); font-weight: 400; font-size: 22px; color: var(--ink); }
#tPts { color: var(--core); }
#tTok b { color: var(--cryo); }
/* v5.0 talents: tabs | tree | details */
#tbody { position: absolute; top: 52px; left: max(8px, var(--sal)); right: max(8px, var(--sar)); bottom: max(6px, var(--sab)); display: grid; grid-template-columns: 150px minmax(0, 1fr) min(300px, 32%); gap: 10px; }
#ttabs { display: flex; flex-direction: column; gap: 4px; overflow-y: auto; padding: 8px 0; scrollbar-width: none; }
#ttabs::-webkit-scrollbar { display: none; }
.ttab { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; text-align: left; border: 0; background: var(--panel); padding: 5px 9px; min-height: 40px; box-shadow: inset 3px 0 0 var(--c, var(--line2)), inset 0 0 0 1px var(--line); }
.ttab b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; text-transform: uppercase; color: var(--c, var(--ink)); }
.ttab small { font-size: 15px; color: var(--dim); }
.ttab.on { background: #1a1e3a; box-shadow: inset 4px 0 0 var(--c, var(--amber)), inset 0 0 0 1px var(--c, var(--amber)); }
.ttab.sum { margin-top: 6px; --c: var(--amber); }
#tgrid { overflow-y: auto; padding: 8px 2px 12px; touch-action: pan-y; }
.thead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 12px; margin-bottom: 8px; }
.thead b { font-family: var(--f-pix); font-size: 14px; font-weight: 700; text-transform: uppercase; color: var(--c, var(--amber)); }
.thead span { color: var(--dim); font-size: 17px; }
.thead em { font-style: normal; margin-left: auto; font-size: 16px; color: var(--ink); }
.trow { display: grid; grid-template-columns: 38px minmax(0, 1fr); gap: 8px; margin-bottom: 6px; }
.trl { display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--panel); box-shadow: inset 0 0 0 1px var(--line); }
.trl b { font-family: var(--f-pix); font-size: 12px; font-weight: 400; color: var(--ink); }
.trl small { font-size: 13px; color: var(--dim); white-space: nowrap; }
.trow.locked .trl b { color: var(--dim); }
.trt { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 6px; }
.ttile { position: relative; display: flex; min-width: 0; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); }
.ttile .tbody { flex: 1; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; grid-template-rows: auto auto auto; gap: 1px 6px; align-items: center; text-align: left; border: 0; background: none; padding: 6px 8px 7px; }
.ttile .tbody b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; text-transform: uppercase; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ttile .tbody b em { font-style: normal; color: #ff9adf; }
.ttile .tbody small { font-size: 15px; color: var(--dim); }
.ttile .pips { grid-column: 1 / -1; display: flex; gap: 3px; }
.ttile .pips i { width: 10px; height: 4px; background: #2a2f52; }
.ttile .pips i.on { background: var(--c); }
.ttile .td { grid-column: 1 / -1; font-size: 15px; line-height: 1.05; color: var(--dim); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ttile .tadd { flex: 0 0 40px; border: 0; background: rgba(89, 240, 180, 0.12); color: var(--core); font-family: var(--f-pix); font-size: 18px; box-shadow: inset 1px 0 0 var(--line2); }
.ttile .tadd:active { background: rgba(89, 240, 180, 0.3); }
.ttile.have { box-shadow: inset 0 0 0 1px var(--c), inset 3px 0 0 var(--c); }
.ttile.have .tbody b { color: var(--c); }
.ttile.full { background: #171c38; }
.ttile.locked { opacity: 0.45; }
.ttile.sel { box-shadow: inset 0 0 0 2px var(--amber); }
.ttile.cap { background: linear-gradient(180deg, #1d1a33, #141831); min-height: 64px; }
.ttile.cap .tbody b { font-size: 11px; }
.ttile.cap .td { -webkit-line-clamp: 3; color: #b9b6cc; }
.ttile.cap.have { box-shadow: inset 0 0 0 2px var(--c); background: linear-gradient(180deg, #24213e, #1a1e3c); }
.caprow .trl b { color: var(--warn); font-size: 14px; }
.caprow .trt { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.tfoot { font-size: 15px; margin-top: 6px; }
#tinfo { overflow-y: auto; padding: 10px 12px; margin: 8px 0; background: rgba(12, 14, 28, 0.94); box-shadow: inset 0 0 0 1px var(--line2); }
.tinfo-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-top: 10px; }
.tinfo-empty b { font-family: var(--f-term); font-size: 44px; font-weight: 400; color: var(--core); line-height: 1; }
.tinfo-empty span { font-family: var(--f-pix); font-size: 10px; text-transform: uppercase; color: var(--dim); }
.tinfo-t { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
.tinfo-t em { font-style: normal; font-family: var(--f-pix); font-size: 8px; text-transform: uppercase; color: var(--c); letter-spacing: 0.06em; }
.tinfo-t b { font-family: var(--f-pix); font-size: 13px; text-transform: uppercase; }
.tinfo-t small { font-size: 16px; color: var(--dim); }
.tl { margin: 2px 0 6px; padding-left: 16px; font-size: 17px; }
.tl.dim { color: var(--dim); }
.tbtns { display: flex; gap: 8px; margin-top: 8px; }
.tbtns .btn { flex: 1; min-height: 46px; justify-content: center; }
.tbuilds { background: var(--panel); box-shadow: inset 0 0 0 1px var(--line2); padding: 8px 10px; margin-bottom: 10px; }
.tbuilds .lbl em { font-family: var(--f-term); font-size: 15px; font-style: normal; text-transform: none; letter-spacing: 0; margin-left: 6px; }
.tb { display: grid; grid-template-columns: minmax(0, 0.7fr) minmax(0, 1.3fr) auto auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px solid var(--line); }
.tb b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; text-transform: uppercase; }
.tb small { font-size: 15px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tsumcap { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 10px; background: var(--panel2); padding: 6px 9px; margin-bottom: 4px; box-shadow: inset 3px 0 0 var(--c); }
.tsumcap b { font-family: var(--f-pix); font-size: 10px; font-weight: 400; text-transform: uppercase; color: var(--c); }
.tsumcap small { font-size: 15px; color: var(--dim); }
.tsumcap span { grid-column: 1 / -1; font-size: 16px; }
.tsum { columns: 2; column-gap: 20px; margin: 4px 0 8px; padding-left: 16px; font-size: 16px; }
.tbars div { display: grid; grid-template-columns: 110px minmax(0, 1fr) 30px; gap: 8px; align-items: center; font-size: 16px; margin: 2px 0; }
.tbars i { display: block; height: 8px; background: var(--c); }
.tbars b { font-weight: 400; text-align: right; }
@media (max-width: 760px) { #tbody { grid-template-columns: 112px minmax(0, 1fr) min(240px, 34%); gap: 6px; } .ttab { padding: 4px 6px; } .ttab b { font-size: 9px; } .trt { grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); } .tsum { columns: 1; } #tbar { gap: 8px; } .tpts { font-size: 8px; } }

/* ---------- rotate overlay ---------- */
#rotate { display: none; }
@media (orientation: portrait) and (max-width: 600px) {
  body:not(.portrait-ok) #rotate { display: flex; position: fixed; inset: 0; z-index: 50; background: var(--bg); flex-direction: column; align-items: center; justify-content: center; gap: 16px; text-align: center; padding: 24px; }
}
#rotate .ph-icon { width: 46px; height: 80px; box-shadow: inset 0 0 0 3px var(--amber); animation: rot 2s infinite; }
@keyframes rot { 40%, 100% { transform: rotate(90deg); } }
@media (max-width: 760px) {
  :root { --rail: 50px; }
  #hud { gap: 11px; } .corebox > .lbl { display: none; } #hpbar { width: 54px; }

}

@media (max-height: 340px) { .rb { height: 38px; } .rb span { display: none; } .entg { height: 54px; } #bCall { height: 46px; } }


/* v5.0 token reroll */
.btn.tokbtn { box-shadow: inset 0 0 0 2px var(--cryo); color: #bff4ff; }
/* v4.8 level tiers */
.btn.primary.lvup { background: var(--tc, var(--amber)); color: #0b0b12; }
.btn.primary.lvup small { color: rgba(11, 11, 18, 0.72); }
.lvtag { display: inline-block; font-family: var(--f-pix); font-weight: 400; font-size: 9px; color: #0b0b12; padding: 1px 4px; margin-right: 2px; vertical-align: 1px; }
/* ---------- v5.5 Music Studio: tabs, a pinned now-playing bar, Listen / Shape / Compose ---------- */
.card.studio { width: min(920px, 100%); height: min(600px, 100%); }
.card.studio > .ch { align-items: center; gap: 8px; margin-bottom: 0; padding-bottom: 8px !important; box-shadow: 0 1px 0 var(--line); }
.card.studio > .ch h2 { margin: 0; }
.sttabs { display: flex; gap: 6px; margin-left: 4px; }
.sttabs .chip { min-height: 34px; padding: 0 12px; }
.stnow { flex: 1 1 100%; display: grid; grid-template-columns: 160px minmax(0, 1fr) auto; gap: 12px; align-items: center; background: var(--panel2); padding: 6px 8px; box-shadow: inset 0 0 0 1px var(--gc, var(--line2)); margin-top: 6px; }
#stViz { width: 160px; height: 48px; display: block; background: #05060c; cursor: pointer; }
.stinfo { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.stinfo b { font-family: var(--f-pix); font-size: 13px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stinfo .lbl { color: var(--gc, var(--amber)); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stmeta { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 15px; color: var(--dim); white-space: nowrap; }
.stmeta em { font-style: normal; color: var(--gc, var(--amber)); font-family: var(--f-pix); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em; overflow: hidden; text-overflow: ellipsis; }
.stbar { height: 3px; background: var(--line); margin-top: 3px; } .stbar i { display: block; height: 100%; width: 0; background: var(--gc, var(--amber)); }
.sttr { display: flex; gap: 6px; }
.stb { width: 40px; height: 40px; display: grid; place-items: center; background: var(--panel); border: 0; padding: 0; box-shadow: inset 0 0 0 1px var(--line2); color: #c9c6dc; font-family: var(--f-term); font-size: 16px; flex: none; }
.stb .svgi { width: 18px; height: 18px; }
.stb.on { box-shadow: inset 0 0 0 2px var(--gc, var(--amber)); color: var(--gc, var(--amber)); }
.stb.keep.on { box-shadow: inset 0 0 0 2px #ff5fa8; color: #ff5fa8; }
.stb:disabled { opacity: 0.35; }
.stb:active { filter: brightness(1.35); transform: translateY(1px); }
.stl { margin: 8px 0 5px; display: block; } .stl em { font-family: var(--f-term); font-size: 15px; text-transform: none; letter-spacing: 0; font-style: normal; margin-left: 6px; }
.stcol { min-width: 0; }
.strow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 6px; }
.stcode, .stren, #cpName { flex: 1 1 140px; min-width: 0; background: #05060c; border: 0; box-shadow: inset 0 0 0 1px var(--line2); color: var(--ink); font-family: var(--f-term); font-size: 17px; padding: 6px 8px; min-height: 36px; }
.stcode:focus, .stren:focus, #cpName:focus { outline: 2px solid var(--gc, var(--amber)); outline-offset: -2px; }
/* Listen */
.stlisten { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; }
.stvibe { display: flex; gap: 6px; flex-wrap: wrap; }
.stvibe .chip { min-height: 36px; padding: 0 12px; }
.stgen { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 6px; }
.gw { display: flex; min-width: 0; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--c); }
.gw.on { background: var(--c); }
.gch { flex: 1; min-width: 0; border: 0; background: none; font-family: var(--f-pix); font-size: 10px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--c); padding: 0 4px; min-height: 40px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.gw.on .gch { color: #0b0b12; }
.gpl { width: 30px; flex: none; border: 0; padding: 0; display: grid; place-items: center; background: rgba(0, 0, 0, 0.3); color: var(--c); }
.gw.on .gpl { color: #0b0b12; background: rgba(0, 0, 0, 0.14); }
.gpl .svgi { width: 11px; height: 11px; }
.stblurb { font-size: 15px; margin: 8px 0 0; }
.stfavs { display: flex; flex-direction: column; gap: 4px; }
.stfav { display: flex; gap: 4px; align-items: center; background: var(--panel2); padding: 3px 4px 3px 10px; box-shadow: inset 3px 0 0 var(--c); }
.stft { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.stft .dim { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stnm { background: none; border: 0; padding: 0; text-align: left; color: var(--ink); min-width: 0; }
.stnm b { display: block; font-family: var(--f-pix); font-size: 11px; font-weight: 400; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stfav .stb { width: 36px; height: 36px; }
.stfav .stb .svgi { width: 14px; height: 14px; }
.stb.del { width: auto; min-width: 36px; padding: 0 8px; }
.stb.del.arm { background: var(--bad); color: #1a0008; box-shadow: none; font-family: var(--f-pix); font-size: 9px; text-transform: uppercase; }
/* Shape */
.stshape { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; }
.st2 { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 0 8px; margin-bottom: 6px; }
.st2 > span:first-child { font-size: 17px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.st2 output { font-size: 16px; color: var(--dim); white-space: nowrap; font-variant-numeric: tabular-nums; }
.st2 .rng { grid-column: 1 / -1; } .st2 input[type=range] { width: 100%; --fc: var(--gc, var(--amber)); display: block; }
.st2 input:disabled { opacity: 0.4; }
.rng { position: relative; display: block; min-width: 0; }
.rng.mid::after { content: ''; position: absolute; left: 50%; top: 5px; width: 2px; height: 20px; margin-left: -1px; background: rgba(255,255,255,0.35); pointer-events: none; }

.stlen { margin: 2px 0 6px; } .stlen .chip { min-height: 32px; padding: 0 10px; }
.mixer { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 5px; background: #05060c; padding: 8px 5px 5px; box-shadow: inset 0 0 0 1px var(--line); }
.fch { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.fader { position: relative; width: 30px; height: 150px; background: var(--panel2); box-shadow: inset 0 0 0 1px var(--line2); touch-action: none; cursor: ns-resize; }
.fader .fmeter { position: absolute; left: 3px; bottom: 0; width: 5px; height: 0; background: linear-gradient(to top, var(--core) 60%, var(--warn) 85%, var(--bad)); transition: height 0.06s linear; }
.fader .ffill { position: absolute; left: 11px; right: 3px; bottom: 0; background: var(--gc, var(--amber)); opacity: 0.32; }
.fader .fknob { position: absolute; left: 8px; right: -2px; height: 8px; margin-bottom: -4px; background: var(--ink); box-shadow: 0 2px 0 rgba(0,0,0,0.5); pointer-events: none; }
.fmute { font-family: var(--f-pix); font-size: 7px; text-transform: uppercase; background: var(--panel2); border: 0; width: 100%; min-height: 30px; padding: 0 1px; box-shadow: inset 0 0 0 1px var(--line2); overflow: hidden; }

const STRAIN_COMBO = { 'haste+wings': 'Zoomwing', 'bulk+plating': 'Fortress', 'brood+bulk': 'Momma', 'cloak+haste': 'Ninja', 'regen+shell': 'Immortal-ish', 'plating+wings': 'Gunship',

function strainName(type, genes, el) {
  const g = genes.slice().sort(), sp = SPECIES_NICK[type] || (ENEMIES[type] ? ENEMIES[type].name : type);
  for (let i = 0; i < g.length; i++) for (let j = i + 1; j < g.length; j++) { const c = STRAIN_COMBO[g[i] + '+' + g[j]]; if (c) { const rest = g.filter((x, k) => k !== i && k !== j).map(x => x === 'ward' ? WARD_ADJ[el] || 'Warded' : GENE_ADJ[x]); return (rest.length ? rest.join(' ') + ' ' : '') + c + ' ' + sp; } }
  return g.map(x => x === 'ward' ? WARD_ADJ[el] || 'Warded' : GENE_ADJ[x]).join(' ') + ' ' + sp;
}

  let novaFlow = null;
  function novaOffers() {
    PROF.novaOffer = PROF.novaOffer && PROF.novaOffer.n === (PROF.nova || 0) ? PROF.novaOffer : null;
    if (!PROF.novaOffer) {
      const pool = LAWS.filter(L => !PROF.laws.includes(L.id)).map(L => L.id), out = [];
      while (pool.length && out.length < 3) out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
      PROF.novaOffer = { n: PROF.nova || 0, laws: out }; Save.save();
    }
    return PROF.novaOffer.laws;
  }

    Hooks.onUnlock = k => { if (G) (G.unlocks || (G.unlocks = [])).push(k); if (panel && panel.kind === 'build') renderPanel(); };
    Hooks.onChange = () => { if (G && panel) renderPanel(); Save.save(); };
    Hooks.onSave = () => Save.save();
    Hooks.onWave = () => {};
    Hooks.onCheckpoint = w => { toast('CHECKPOINT', 'A wormhole opens next wave. Rebuild, then Resume fast for a bonus.', '#59f0b4'); if (panel && panel.kind === 'tower') renderPanel(); Save.save(); };
    Hooks.onEntropy = () => {};
    Hooks.newEnemy = k => setTimeout(() => enemyCard(k), 400);
    Hooks.abilReady = k => { const b = document.querySelector(`[data-abil="${k}"]`); if (b) { b.classList.remove('ping'); void b.offsetWidth; b.classList.add('ping'); } };
    Hooks.scanned = e => { const nm = e.boss ? e.bossName : ENEMIES[e.type] ? ENEMIES[e.type].name : e.type, gs = (e.genes || []).filter(g => GENES[g]);
      const beat = gs.length ? GENES[gs[0]].counter : ENEMIES[e.type] && ENEMIES[e.type].beat;
      toast('BIGGEST THREAT', `${nm}${gs.length ? ' · ' + gs.map(g => GENES[g].name).join(', ') : ''} · ${fmt(e.hp)} HP${beat ? ' · Beat it: ' + beat : ''}`, '#ffb03a', true, 'tip'); };
  }
  function tick(dt) {

    if (screen === 'game' && G && G.huntChoice && !G.draft && !G.over && !modalOpen && !Tree.isOpen && !G.watch) { closePanel(); openHunt(); }

    const live = screen === 'game' && G && !G.over && !G.paused && !modalOpen && !Tree.isOpen;
    let nb = 0, rk = 0;
    if (live) for (const t of G.towers) if (t.beamTargets && t.beamTargets.length && t.disabled <= 0) { nb++; rk = Math.max(rk, (t.ramp || 0) / (t.s.rampMax || 3.5)); }

// ---------------- v5.0 Talents screen (replaces the 3D passive web) ----------------
// Tree tabs on the left, the chosen tree's rows in the middle, the selected talent's details on the right. Tap a talent to see it,
// tap + to add a rank (or double-tap the talent). Everything is plain DOM: it scrolls like any page on a phone.
const Tree = (() => {
  let mode = null, open_ = false, cur = 'K', sel = null, drawer = null, lastTap = { id: null, t: 0 }, confirmReset = false;
  const el = id => document.getElementById(id);
  const capName = id => TAL[id] ? TAL[id].name : id;
  function init() {
    el('tree').addEventListener('click', e => {
      const b = e.target.closest('[data-tact]'); if (!b) return;
      const a = b.dataset.tact, v = b.dataset.v;
      if (a === 'close') { close(); return; }
      if (a === 'tab') { cur = v; sel = null; drawer = null; SFX.play('ui'); refresh(); el('tgrid').scrollTop = 0; return; }
      if (a === 'sum') { cur = 'sum'; sel = null; drawer = null; SFX.play('ui'); refresh(); return; }

        const now = performance.now();

      if (a === 'bsave') { treeSaveBuild(+v); Save.save(); UI.toast('BUILD SAVED', `Slot ${+v + 1}`, '#59f0b4'); refresh(); return; }
      if (a === 'bload') { const r = treeLoadBuild(+v); if (r === 'ok') { SFX.play('upgrade'); UI.toast('BUILD LOADED', PROF.builds[+v].name, '#59f0b4'); } else UI.toast('CAN\'T LOAD', r === 'points' ? 'Not enough points for that build yet' : r === 'tokens' ? 'Loading a build mid-run costs 2 Recalibration tokens' : 'Empty slot', '#ff4d6a'); refresh(); return; }
    });
  }
  function add(id) {

    if (TAL[id].cap) UI.toast('CAPSTONE', `${TAL[id].name} · ${TREE_BY_ID[TAL[id].tree].name}`, TREE_BY_ID[TAL[id].tree].col);

  }
  function remove(id) {
    const why = talentCanRemove(id);
    if (why) { SFX.play('deny'); UI.toast('CAN\'T REMOVE', why === 'tokens' ? `Refunding mid-run costs ${refundCost(id)} Recalibration token${refundCost(id) > 1 ? 's' : ''} (you have ${G ? G.tokens : 0})` : why === 'cap' ? 'Your Capstone needs 20 points in this tree' : why === 'row' ? 'A talent further down needs these points' : 'Nothing to remove', '#ff4d6a'); return; }

  function blockMsg(id, why) {

    if (why === 'slots') { const lv = talLevel(), n = TAL_EDIT ? 0 : CAP_NEXT(lv); return `You can hold ${capSlots(lv)} Capstone${capSlots(lv) > 1 ? 's' : ''}${n ? `; another slot opens at Level ${n}` : ''}. Remove one first`; }

  function tile(T, tr) {
    const r = T.cap ? (activeCaps().includes(T.id) ? 1 : 0) : talRank(T.id), why = talentBlock(T.id), canAdd = !why, locked = why === 'row', full = !T.cap && r >= T.max;
    const rem = (TS().remnants || []).includes(T.id);

  }

      return `<div class="trow ${ok ? '' : 'locked'}"><div class="trl"><b>${r + 1}</b>${r ? `<small>${need} pts</small>` : ''}</div><div class="trt">${row.map(T => tile(T, tr)).join('')}</div></div>`;

      <div class="trow caprow ${capOk ? '' : 'locked'}"><div class="trl"><b>★</b><small>${TCAP} pts</small></div><div class="trt">${tr.caps.map(T => tile(T, tr)).join('')}</div></div>
      <p class="note tfoot">Capstones change how you play. Pick one per tree; you can hold ${capSlots(profLevel().level)} at Level ${profLevel().level}${CAP_NEXT(profLevel().level) ? ` (another at Level ${CAP_NEXT(profLevel().level)})` : ''}.</p>`;

      <div class="lbl">Capstones</div>${caps.length ? caps.map(id => { const T = TAL[id], tr = TREE_BY_ID[T.tree]; return `<div class="tsumcap" style="--c:${tr.col}"><b>${esc(T.name)}</b><small>${esc(tr.name)}${(TS().remnants || []).includes(id) ? ' · Remnant' : ''}</small><span>${talentLines(T).map(esc).join(' · ')}</span></div>`; }).join('') : '<p class="note">None yet. Spend 20 points in one tree to reach its Capstones.</p>'}
      <div class="lbl">Bonuses</div><p class="note">Every point spent: +${TAL_PT_DMG}% Damage to all towers (now +${+(pointsSpent() * TAL_PT_DMG).toFixed(1)}%).</p>${lines.length ? `<ul class="tsum">${lines.map(l => `<li>${esc(l)}</li>`).join('')}</ul>` : '<p class="note">No talents yet.</p>'}
      <div class="lbl">Per tree</div><div class="tbars">${TALENTS.map(tr => `<div style="--c:${tr.col}"><span>${esc(tr.name)}</span><i style="width:${Math.min(100, treePts(tr.id) / 26 * 100)}%"></i><b>${treePts(tr.id)}</b></div>`).join('')}</div>`;
  }
  function infoHTML() {
    if (!sel || !TAL[sel]) return `<div class="tinfo-empty"><b>${pointsFree()}</b><span>point${pointsFree() === 1 ? '' : 's'} to spend</span><p class="note">Tap a talent to read it. Tap + (or double-tap) to add a rank.</p><p class="note">Each row opens after 5 points in that tree. Capstones open at 20. Every point also adds +${TAL_PT_DMG}% Damage to all towers.</p></div>`;
    const T = TAL[sel], tr = TREE_BY_ID[T.tree], r = T.cap ? (activeCaps().includes(T.id) ? 1 : 0) : talRank(T.id), why = talentBlock(T.id), rw = talentCanRemove(T.id);
    const now = r ? talentLines(T, r) : null, next = !T.cap && r < T.max ? talentLines(T, r + 1) : null;
    const rem = (TS().remnants || []).includes(T.id);
    return `<div class="tinfo-t" style="--c:${tr.col}"><em>${esc(tr.name)}${T.cap ? ' · Capstone' : ` · Row ${T.row + 1}`}</em><b>${esc(T.name)}</b>${T.cap ? `<small>${r ? (rem ? 'Remnant: always on' : 'Yours') : 'Not taken'}</small>` : `<small>Rank ${r} of ${T.max}</small>`}</div>
      ${T.cap ? `<ul class="tl">${talentLines(T).map(l => `<li>${tipify(l)}</li>`).join('')}</ul>` : `${now ? `<div class="lbl">Now</div><ul class="tl">${now.map(l => `<li>${tipify(l)}</li>`).join('')}</ul>` : ''}${next ? `<div class="lbl">${r ? 'Next rank' : 'Rank 1'}</div><ul class="tl dim">${next.map(l => `<li>${tipify(l)}</li>`).join('')}</ul>` : ''}`}
      ${why && why !== 'max' && why !== 'have' ? `<p class="note bad">${esc(blockMsg(T.id, why))}</p>` : ''}
      <div class="tbtns">${!rem && (r > 0) ? `<button class="btn" data-tact="rem" data-v="${T.id}" ${rw && rw !== 'tokens' ? 'disabled' : ''}>Remove${refundFree() ? '' : `<small>${refundCost(T.id)} token${refundCost(T.id) > 1 ? 's' : ''}</small>`}</button>` : ''}
      ${!why ? `<button class="btn primary" data-tact="add" data-v="${T.id}">${T.cap ? 'Take Capstone' : r ? 'Add rank' : 'Learn'}<small>1 point</small></button>` : ''}</div>`;

  function buildsHTML() {
    return `<div class="tbuilds"><div class="lbl">Builds <em>save a layout, load it later${refundFree() ? '' : ' (2 tokens mid-run)'}</em></div>${PROF.builds.map((b, i) => `<div class="tb"><b>${b && b.tal ? esc(b.name) : `Slot ${i + 1}`}</b><small>${b && b.tal ? `${b.lvl} pts · ${(b.caps || []).map(capName).map(esc).join(', ') || 'no Capstone'}` : 'empty'}</small><button class="btn small" data-tact="bsave" data-v="${i}">Save</button><button class="btn small" data-tact="bload" data-v="${i}" ${b && b.tal ? '' : 'disabled'}>Load</button></div>`).join('')}</div>`;

// ---------------- Main loop ----------------
(function boot() {
  const loaded = Save.loadLocal();
  if (loaded) PROF = loaded;
  const webReset = migrateWeb();
  if (webReset) { Save.save(); setTimeout(() => UI.toast('TALENTS ARRIVE', 'The passive web is now seven Talent trees. Every point is refunded: open Talents to spend them', '#ffb03a'), 900); }
  const capDrop = tidyCaps();
  if (capDrop.length) { Save.save(); setTimeout(() => UI.toast('CAPSTONE REFUNDED', `One Capstone per tree now: ${capDrop.map(c => TAL[c].name).join(', ')} refunded. Spend the point elsewhere`, '#ffb03a'), 1400); }
  Render.init($('#cv'));
  Render.onCam = () => UI.zoomChanged && UI.zoomChanged();
  Tree.init();
  hydrateIcons();
  UI.wire();
  UI.renderHangar();
  UI.show('hangar');
  // returning players see what changed once per version; brand-new players skip it
  if (!PROF.runs) { PROF.seenVer = VERSION; }
  else if (PROF.seenVer !== VERSION) setTimeout(() => { if (UI.screen === 'hangar' && !UI.modalOpen && WHATS_NEW.items.length) UI.openNews(); }, 900);
  SFX.setVolumes(PROF.settings.sfx, PROF.settings.music); SFX.setMono(!!PROF.settings.mono);
  SFX.setSoundtrack(PROF.settings.soundtrack || 'ec'); SFX.music.setConfig(PROF.settings.studio); PROF.settings.studio = SFX.music.config; SFX.music.setBaseBpm(PROF.settings.bpm || 72);
  Save.initRemote();
  // Home Screen copy: notice a newer release (Pages caches pages for ~10 min, and iOS keeps the app in memory)
  // and reload onto it from the main menu, never mid-run
  let updTo = null, updAt = 0;
  function checkUpdate() {
    if (!/github\.io$/.test(location.hostname) || !window.fetch) return;
    const now = Date.now(); if (now - updAt < 60000) return; updAt = now;
    fetch(location.pathname, { cache: 'reload' }).then(r => r.ok ? r.text() : '').then(t => {
      const m = t.match(/const VERSION = '([0-9.]+)'/);
      if (m && m[1] !== VERSION) updTo = m[1];
    }).catch(() => {});
  }
  checkUpdate();
  document.addEventListener('visibilitychange', () => { if (!document.hidden) checkUpdate(); });
  setInterval(() => {
    if (!updTo || UI.screen !== 'hangar' || UI.modalOpen || Tree.isOpen) return;
    let tried = null; try { tried = sessionStorage.getItem('entropy.upd'); } catch (e) {}
    if (tried === updTo) { updTo = null; return; } // already reloaded for this one; don't loop
    try { sessionStorage.setItem('entropy.upd', updTo); } catch (e) {}
    UI.toast('UPDATING', 'Version ' + updTo, '#59f0b4', true);
    Save.save(); if (Save.flushNow) Save.flushNow();
    updTo = null; setTimeout(() => location.reload(), 900);
  }, 1000);
  // hangar backdrop (v5.5: HangarFX in render.js)
  const bg = $('#bgfx'); const drawBg = dt => HangarFX.draw(bg, dt);
  let last = performance.now(), acc = 0, wakeT = 2;
  const STEP = 1 / 30;
  function frame(ts) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.1, Math.max(0, (ts - last) / 1000)); last = ts;
    if (UI.screen === 'game' && G) {
      if (G.checkpoint && !G.paused && !G.reloc && UI.modalOpen !== 'pause' && !document.hidden) G.cpT += dt;
      if (UI.slowmo > 0) UI.slowmo -= dt;
      if (G.watch && !G.paused && !UI.modalOpen) UI.watchFeed();
      const halted = G.over || G.paused || G.draft || G.huntChoice || (G.checkpoint && !G.enemies.length) || Tree.isOpen || UI.modalOpen;
      if (!halted) {
        acc += dt * G.speed * (UI.slowmo > 0 ? 0.3 : 1);
        let n = 0;
        while (acc >= STEP && n < 10) { simStep(STEP); acc -= STEP; n++; }
        if (n >= 10) acc = 0;
      }
      Render.draw(halted ? 0 : dt);
    } else { if (UI.screen === 'hangar') drawBg(dt); ART.idle(4); } // menus: pre-render unit art in the background
    if (Tree.isOpen) Tree.draw();
    wakeT -= dt; if (wakeT <= 0) { wakeT = 2; if (!document.hidden) SFX.wake(); } // iOS can leave the sound 'interrupted'
    UI.tick(dt);
  }
  setTimeout(() => UNITS.warmEnemies(), 1500);
  requestAnimationFrame(frame);
})();
